<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Meal Planner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-to-dashboard-icon" title="Back to Dashboard">
            <i class="fas fa-home"></i>
        </a>
        
        <h1><i class="fas fa-calendar-alt"></i> Weekly Meal Planner</h1>
        <p>Displays the current week's meal plan pulled directly from your Google Sheet.</p>

        <h2 id="meal-plan-header"><i class="fas fa-list-check"></i> Current Plan <span id="date-range-header"></span></h2>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Date</th>
                    <th>Breakfast</th>
                    <th>Lunch</th>
                    <th>Dinner</th>
                </tr>
            </thead>
            <tbody id="meal-plan-body">
                </tbody>
        </table>
        
        <p class="mt-4">
           To update the plan, please modify the "Meal Planner" tab in your connected Google Sheet.
        </p>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
