<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Activity Log</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-to-dashboard-icon" title="Back to Dashboard">
            <i class="fas fa-home"></i>
        </a>
        
        <h1><i class="fas fa-utensils"></i> Kitchen Activity Log</h1>
        <p>Record the cook's daily schedule and meals prepared.</p>

        <div class="kitchen-layout">
            
            <div class="stats-card-container">
                <h2 style="margin-top: 0;"><i class="fas fa-chart-line"></i> Quick Stats</h2>

                <div class="stat-card primary">
                    <div class="stat-label">Average Rating</div>
                    <div class="stat-value" id="avg-rating">4.5 <i class="fas fa-star"></i></div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Favorite Cook</div>
                    <div class="stat-value" id="fav-cook">Pallavi</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Meals Logged This Month</div>
                    <div class="stat-value" id="meals-logged">28</div>
                </div>
            </div>

            <div class="form-section">
                <h2><i class="fas fa-pen-to-square"></i> Log Daily Activity</h2>
                <form id="activity-form">
                    <div class="multi-field-group">
                        <div class="form-group">
                            <label for="logDate">Date</label>
                            <input type="date" id="logDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="cookName">Cook Name</label>
                            <input type="text" id="cookName" class="form-control" required value="Pallavi" placeholder="e.g., Pallavi">
                        </div>
                    </div>
                    
                    <div class="multi-field-group">
                        <div class="form-group">
                            <label for="timeIn">Time In</label>
                            <input type="text" id="timeIn" class="form-control" required placeholder="e.g., 8:00 AM">
                        </div>
                        <div class="form-group">
                            <label for="timeOut">Time Out</label>
                            <input type="text" id="timeOut" class="form-control" required placeholder="e.g., 10:30 AM">
                        </div>
                    </div>

                    <div class="multi-field-group">
                        <div class="form-group">
                            <label for="meal1">Meal 1 (Breakfast)</label>
                            <input type="text" id="meal1" class="form-control" placeholder="e.g., Dosa/Idli">
                        </div>
                        <div class="form-group">
                            <label for="meal2">Meal 2 (Lunch)</label>
                            <input type="text" id="meal2" class="form-control" placeholder="e.g., Rice & Sambar">
                        </div>
                        <div class="form-group">
                            <label for="meal3">Meal 3 (Dinner)</label>
                            <input type="text" id="meal3" class="form-control" placeholder="e.g., Chapati & Curry">
                        </div>
                    </div>

                    <div class="multi-field-group">
                        <div class="form-group">
                            <label for="rating">Rating (1-5)</label>
                            <select id="rating" class="form-control" required>
                                <option value="5">5 - Excellent</option>
                                <option value="4">4 - Good</option>
                                <option value="3">3 - Average</option>
                                <option value="2">2 - Needs Improvement</option>
                                <option value="1">1 - Poor</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="foodRemarks">Remarks/Notes</label>
                            <textarea id="foodRemarks" class="form-control" rows="1"></textarea>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-plus"></i> Add Activity</button>
                </form>
            </div>
        </div>

        <h2 class="mt-5"><i class="fas fa-list-ul"></i> Activity History</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Cook</th>
                    <th>Time</th>
                    <th>Meal 1</th>
                    <th>Meal 2</th>
                    <th>Meal 3</th>
                    <th>Rating</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody id="activity-list">
                </tbody>
        </table>
        
        </div>

    <script type="module" src="script.js?v=10"></script>
</body>
</html>
