<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-to-dashboard-icon" title="Back to Dashboard">
            <i class="fas fa-home"></i>
        </a>
        
        <h1><i class="fas fa-wallet"></i> Monthly Expense Tracker</h1>
        <p>Log all food and related household expenses below.</p>

        <h2><i class="fas fa-pen-to-square"></i> Log New Expense</h2>
        <form id="expense-form">
            
            <div class="multi-field-group">
                <div class="form-group">
                    <label for="logDate">Date</label>
                    <input type="date" id="logDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" class="form-control" required>
                        <option value="">-- Select Category --</option>
                        <option value="Food Order">Food Order</option>
                        <option value="Milk/Dairy">Milk/Dairy</option>
                        <option value="Other Grocery">Other Grocery</option>
                        <option value="Miscellaneous">Miscellaneous</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="restaurant">Restaurant/Store Name</label>
                <input type="text" id="restaurant" class="form-control" placeholder="e.g., Swiggy, Daily Needs Mart">
            </div>

            <label style="margin-top: 10px;">Amounts (Enter 0 if not applicable)</label>
            <div class="multi-field-group">
                <div>
                    <label for="orderAmount">Food Order</label>
                    <input type="number" step="0.01" min="0" id="orderAmount" class="form-control" value="0" required>
                </div>
                <div>
                    <label for="milkAmount">Milk</label>
                    <input type="number" step="0.01" min="0" id="milkAmount" class="form-control" value="0" required>
                </div>
                <div>
                    <label for="curdAmount">Curd/Dairy</label>
                    <input type="number" step="0.01" min="0" id="curdAmount" class="form-control" value="0" required>
                </div>
                <div>
                    <label for="groceryAmount">Grocery/Other</label>
                    <input type="number" step="0.01" min="0" id="groceryAmount" class="form-control" value="0" required>
                </div>
            </div>

            <div class="form-group">
                <label for="remarks">Remarks/Notes</label>
                <textarea id="remarks" class="form-control"></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-plus"></i> Add Expense</button>
        </form>
        
        <hr style="margin: 40px 0;">

        <h2><i class="fas fa-chart-bar"></i> <span id="summary-header">Monthly Summary</span></h2>
        <div class="summary-card">
            <div class="summary-grid">
                <div>
                    <span class="label">Food Orders:</span>
                    <span id="summary-order" class="amount">--</span>
                </div>
                <div>
                    <span class="label">Milk:</span>
                    <span id="summary-milk" class="amount">--</span>
                </div>
                <div>
                    <span class="label">Curd/Dairy:</span>
                    <span id="summary-curd" class="amount">--</span>
                </div>
                <div>
                    <span class="label">Grocery/Other:</span>
                    <span id="summary-grocery" class="amount">--</span>
                </div>
                <div class="total-row">
                    <span class="label">GRAND TOTAL:</span>
                    <span id="summary-total" class="amount total-amount">--</span>
                </div>
            </div>
        </div>
        <h2 class="mt-5"><i class="fas fa-list-ul"></i> Expense History</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Store</th>
                    <th>Order</th>
                    <th>Milk</th>
                    <th>Curd</th>
                    <th>Grocery</th>
                    <th>Total</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody id="expense-list">
                </tbody>
        </table>
        
        </div>

    <script type="module" src="script.js?v=4"></script>
</body>
</html>
